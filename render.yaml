services:
  - type: web
    name: myfinances
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /Identity/Account/Login
    disk:
      name: app-data
      mountPath: /app/App_Data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myfinances-db
          property: connectionString
      - key: Registration__Enabled
        value: "true"

databases:
  - name: myfinances-db
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: myfinances
    user: myfinances
    postgresMajorVersion: "18"
