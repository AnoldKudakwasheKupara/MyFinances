services:
  - type: web
    name: myfinances
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /Identity/Account/Login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: myfinances-db
          property: connectionString
      - key: Registration__Enabled
        value: "true"

databases:
  - name: myfinances-db
    region: frankfurt
    plan: free
    databaseName: myfinances
    user: myfinances
    postgresMajorVersion: "18"
